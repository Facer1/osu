name: Tablet APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Checkout modified framework
        uses: actions/checkout@v6
        with:
          repository: Facer1/osu-framework
          ref: master
          path: custom-framework

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '11'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Connect modified framework
        shell: pwsh
        run: |
          $file = "osu.Game/osu.Game.csproj"
          $content = Get-Content $file -Raw
          $content = $content -replace '<PackageReference Include="ppy.osu.Framework"[^>]*/>', '<ProjectReference Include="../custom-framework/osu.Framework/osu.Framework.csproj" />'
          Set-Content $file $content

          $file = "osu.Android.props"
          $content = Get-Content $file -Raw
          $content = $content -replace '<PackageReference Include="ppy.osu.Framework.Android"[^>]*/>', '<ProjectReference Include="$(MSBuildThisFileDirectory)custom-framework/osu.Framework.Android/osu.Framework.Android.csproj" />'
          Set-Content $file $content

      - name: Build APK
        run: dotnet build osu.Android/osu.Android.csproj -c Debug -p:AndroidPackageFormat=apk -p:ApplicationId=sh.ppy.osu.tablet

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: osu-tablet-v3
          path: 'osu.Android/**/*-Signed.apk'
          compression-level: 0
          if-no-files-found: error
          
