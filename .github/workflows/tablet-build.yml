name: Tablet APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '11'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build APK
        run: dotnet build osu.Android/osu.Android.csproj -c Debug -p:AndroidPackageFormat=apk -p:ApplicationId=sh.ppy.osu.tablet

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: osu-tablet
          path: '**/*-Signed.apk'
          if-no-files-found: error
          
